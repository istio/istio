# This configs KinD to spin up a k8s cluster with ClusterTrustBundle support enabled
# This should only be used to create K8s clusters with versions >= 1.33
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
kubeadmConfigPatches:
  - |
    apiVersion: kubeadm.k8s.io/v1beta4
    kind: ClusterConfiguration
    etcd:
      local:
        # Run etcd in a tmpfs (in RAM) for performance improvements
        dataDir: /tmp/kind-cluster-etcd
    # We run single node, drop leader election to reduce overhead
    controllerManager:
      extraArgs:
      - name: leader-elect
        value: "false"
    scheduler:
      extraArgs:
      - name: leader-elect
        value: "false"
    apiServer:
      extraArgs:
      - name: service-account-issuer
        value: "kubernetes.default.svc"
      - name: service-account-signing-key-file
        value: "/etc/kubernetes/pki/sa.key"
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
featureGates:
  "ClusterTrustBundle": true
  "ClusterTrustBundleProjection": true
runtimeConfig:
  "certificates.k8s.io/v1beta1/clustertrustbundles": true
