# Control: no ClusterTrustBundle reference, so it is translated whether or not the API is served.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: no-ca-validation
  namespace: istio-system
spec:
  gatewayClassName: istio
  addresses:
  - value: istio-ingressgateway
    type: Hostname
  listeners:
  - name: https
    hostname: "no-ca-validation.example.com"
    port: 443
    protocol: HTTPS
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
      - name: my-cert
