apiVersion: release-notes/v2
kind: feature
area: telemetry
issue:
  - 49950

releaseNotes:
  - |
    **Added** native Prometheus protobuf passthrough through pilot-agent's metrics merger. When a Prometheus scraper sends `Accept: application/vnd.google.protobuf; proto=io.prometheus.client.MetricFamily; encoding=delimited`, native (sparse) histograms from Envoy and the application now reach the scraper unchanged instead of being silently degraded by text-format re-encoding. Envoy emits native histograms only when the scrape request also sets the `histogram_buckets=prometheusnative` query parameter, which pilot-agent forwards to Envoy. The pre-existing text/OpenMetrics scrape path is byte-for-byte unchanged.

  - |
    **Added** a new `istio_agent_scrape_format_total{format,downgrade}` counter to pilot-agent that reports the format negotiation outcome per scrape (text / openmetrics / protobuf, with a downgrade indicator when upstreams disagree).
