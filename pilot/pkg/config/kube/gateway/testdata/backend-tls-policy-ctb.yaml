apiVersion: certificates.k8s.io/v1
kind: ClusterTrustBundle
metadata:
  name: empty-bundle
spec:
  trustBundle: ""
---
apiVersion: certificates.k8s.io/v1
kind: ClusterTrustBundle
metadata:
  name: garbage-bundle
spec:
  trustBundle: |
    this is not a certificate
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: valid
  namespace: default
spec:
  targetRefs:
    - kind: Service
      name: echo
      group: ""
  validation:
    caCertificateRefs:
      - group: certificates.k8s.io
        kind: ClusterTrustBundle
        name: ca-bundle
    hostname: auth.example.com
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: valid-signer-name
  namespace: default
spec:
  targetRefs:
    - kind: Service
      name: example
      group: ""
  validation:
    caCertificateRefs:
      - group: certificates.k8s.io
        kind: ClusterTrustBundle
        name: example.com:signer:ca
    hostname: auth.example.com
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: not-found
  namespace: default
spec:
  targetRefs:
    - kind: Service
      name: httpbin
      group: ""
  validation:
    caCertificateRefs:
      - group: certificates.k8s.io
        kind: ClusterTrustBundle
        name: does-not-exist
    hostname: auth.example.com
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: empty
  namespace: default
spec:
  targetRefs:
    - kind: Service
      name: httpbin-second
      group: ""
  validation:
    caCertificateRefs:
      - group: certificates.k8s.io
        kind: ClusterTrustBundle
        name: empty-bundle
    hostname: auth.example.com
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: garbage
  namespace: default
spec:
  targetRefs:
    - kind: Service
      name: httpbin-other
      group: ""
  validation:
    caCertificateRefs:
      - group: certificates.k8s.io
        kind: ClusterTrustBundle
        name: garbage-bundle
    hostname: auth.example.com
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: first-ref-only
  namespace: default
spec:
  targetRefs:
    - kind: Service
      name: foo-svc
      group: ""
  validation:
    caCertificateRefs:
      - group: certificates.k8s.io
        kind: ClusterTrustBundle
        name: ca-bundle
      - group: ""
        kind: ConfigMap
        name: auth-cert
    hostname: auth.example.com
