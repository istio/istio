apiVersion: release-notes/v2
kind: feature
area: telemetry
issue:
  - 61721
releaseNotes:
  - |
    **Added** the istiod environment variable `PILOT_PROXY_CONVERGENCE_TIME_BUCKETS_SECONDS` to customize
    the histogram boundaries of `pilot_proxy_convergence_time` as comma-separated values in seconds
    (for example, `0.1,0.5,1,5,10,30,60,120`). Boundaries must be finite, nonnegative, and strictly
    increasing. Unset, empty, or invalid values preserve the default boundaries
    `0.1,0.5,1,3,5,10,20,30`. Configure the variable through the istiod Helm chart's `env` settings;
    changes require an istiod restart.
