apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: istio-sidecar-injector-canary
  labels:
    istio.io/rev: canary
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: istiod-canary
      namespace: istio-system
  name: rev.namespace.sidecar-injector.istio.io
  namespaceSelector:
    matchExpressions:
    - key: istio.io/rev
      operator: In
      values:
      - canary
    - key: istio-injection
      operator: DoesNotExist
  objectSelector:
    matchExpressions:
    - key: sidecar.istio.io/inject
      operator: NotIn
      values:
      - "false"
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: istiod-canary
      namespace: istio-system
  name: rev.object.sidecar-injector.istio.io
  namespaceSelector:
    matchExpressions:
    - key: istio.io/rev
      operator: DoesNotExist
    - key: istio-injection
      operator: DoesNotExist
  objectSelector:
    matchExpressions:
    - key: sidecar.istio.io/inject
      operator: NotIn
      values:
      - "false"
    - key: istio.io/rev
      operator: In
      values:
      - canary
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: example-webhook
      namespace: example
  name: webhook.example.com
---
apiVersion: v1
kind: Namespace
metadata:
  name: injection-enabled
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: no-labels
