apiVersion: certificates.k8s.io/v1
kind: ClusterTrustBundle
metadata:
  name: empty-bundle
spec:
  trustBundle: ""
---
apiVersion: certificates.k8s.io/v1
kind: ClusterTrustBundle
metadata:
  name: garbage-bundle
spec:
  trustBundle: |
    this is not a certificate
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: valid
  namespace: istio-system
spec:
  gatewayClassName: istio
  addresses:
  - value: istio-ingressgateway
    type: Hostname
  tls:
    frontend:
      default:
        validation:
          caCertificateRefs:
          - group: certificates.k8s.io
            kind: ClusterTrustBundle
            name: ca-bundle
  listeners:
  - name: https
    hostname: "valid.example.com"
    port: 443
    protocol: HTTPS
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
      - name: my-cert
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: valid-signer-name
  namespace: istio-system
spec:
  gatewayClassName: istio
  addresses:
  - value: istio-ingressgateway
    type: Hostname
  tls:
    frontend:
      default:
        validation:
          caCertificateRefs:
          - group: certificates.k8s.io
            kind: ClusterTrustBundle
            name: example.com:signer:ca
  listeners:
  - name: https
    hostname: "valid-signer-name.example.com"
    port: 443
    protocol: HTTPS
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
      - name: my-cert
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: allow-insecure-fallback
  namespace: istio-system
spec:
  gatewayClassName: istio
  addresses:
  - value: istio-ingressgateway
    type: Hostname
  tls:
    frontend:
      default:
        validation:
          mode: AllowInsecureFallback
          caCertificateRefs:
          - group: certificates.k8s.io
            kind: ClusterTrustBundle
            name: ca-bundle
  listeners:
  - name: https
    hostname: "allow-insecure-fallback.example.com"
    port: 443
    protocol: HTTPS
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
      - name: my-cert
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: options-override
  namespace: istio-system
spec:
  gatewayClassName: istio
  addresses:
  - value: istio-ingressgateway
    type: Hostname
  tls:
    frontend:
      default:
        validation:
          caCertificateRefs:
          - group: certificates.k8s.io
            kind: ClusterTrustBundle
            name: ca-bundle
  listeners:
  - name: https
    hostname: "options-override.example.com"
    port: 443
    protocol: HTTPS
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
      - name: my-cert
      options:
        gateway.istio.io/tls-terminate-mode: OPTIONAL_MUTUAL
---
