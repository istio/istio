apiVersion: release-notes/v2
kind: security-fix
area: security
releaseNotes:
  - |
    **Fixed** an issue where a new inbound connection reusing the 4-tuple of a torn-down connection
    could bypass the sidecar proxy by matching a stale conntrack `ESTABLISHED` entry. A SYN-only
    rule is now evaluated ahead of the `ESTABLISHED` divert rule in both iptables and nftables modes.

securityNotes:
  - |
    __[GHSA-cxwg-46mx-q8hf](https://github.com/istio/istio/security/advisories/GHSA-cxwg-46mx-q8hf)__:
    a new inbound connection reusing the 4-tuple of a torn-down connection could bypass the sidecar
    proxy by matching a stale conntrack `ESTABLISHED` entry. A SYN-only rule is now evaluated ahead
    of the `ESTABLISHED` divert rule in both iptables and nftables modes.
