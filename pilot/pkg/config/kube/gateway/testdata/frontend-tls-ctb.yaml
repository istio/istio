# Gateway frontend TLS validation caCertificateRefs referencing ClusterTrustBundles (GEP-5075).
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: istio
spec:
  controllerName: istio.io/gateway-controller
---
