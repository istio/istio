apiVersion: release-notes/v2
kind: feature
area: installation
releaseNotes:
- |
    **Added** `zonalDeployments` and `zonalDeploymentsTopologyKey` values to the `istiod` and `gateway`
    charts, to run one Deployment and one HorizontalPodAutoscaler per zone instead of a single one.
    Each zone's pods are pinned to their zone and scale on their own load, while the Service and
    PodDisruptionBudget keep selecting the pods of every zone. Combined with
    `trafficDistribution: PreferSameZone`, clients connect to the pods in their own zone and each
    zone scales with the load in that zone.
