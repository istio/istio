# This file provides some defaults for integration testing.
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  name: install
spec:
  profile: ambient
  components:
    ingressGateways:
      - name: istio-ingressgateway
        enabled: true
        k8s:
          service:
            ports:
              ## Default ports
              - port: 15021
                targetPort: 15021
                name: status-port
              - port: 80
                targetPort: 8080
                name: http2
              - port: 443
                targetPort: 8443
                name: https
                # This is the port where sni routing happens
              - port: 15443
                targetPort: 15443
                name: tls
              ## Extra ports for testing
              - port: 15012
                targetPort: 15012
                name: tls-istiod
              - port: 15017
                targetPort: 15017
                name: tls-webhook
              - port: 31400
                targetPort: 31400
                name: tcp
  values:
    meshConfig:
      accessLogFile: /dev/stdout
      # Just used to exclude for testing
      discoverySelectors:
      - matchExpressions:
        - key: istio.io/test-exclude-namespace
          operator: DoesNotExist
    global:
      networkPolicy:
        enabled: true
