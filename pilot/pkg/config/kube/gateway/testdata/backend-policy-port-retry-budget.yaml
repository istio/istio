apiVersion: v1
kind: Service
metadata:
  name: echo-port-budget
  namespace: default
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
  - name: https
    port: 443
    protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: tls-upstream-echo
  namespace: default
spec:
  targetRefs:
    - kind: Service
      name: echo-port-budget
      group: ""
      sectionName: https
  validation:
    caCertificateRefs:
      - kind: ConfigMap
        name: auth-cert
        group: ""
    hostname: auth.example.com
---
apiVersion: gateway.networking.x-k8s.io/v1alpha1
kind: XBackendTrafficPolicy
metadata:
  name: retry-policy
  namespace: default
spec:
  targetRefs:
    - kind: Service
      name: echo-port-budget
      group: ""
  retryConstraint:
    minRetryRate:
      interval: "1s"
      count: 5
    budget:
      percent: 30
      interval: "10s"
