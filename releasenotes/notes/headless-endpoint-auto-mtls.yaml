apiVersion: release-notes/v2
kind: bug-fix
area: traffic-management

releaseNotes:
  - |
    **Fixed** a case where clients kept stale auto-mTLS settings when endpoints changed whether mTLS is inferred
    for a headless Service with only HTTP ports, a ServiceEntry with `resolution: NONE`, or a Service whose
    DestinationRule uses a `PASSTHROUGH` load balancer.
    The mode depends on the endpoints in all clusters, so it can change when endpoints appear, disappear, or change TLS mode.
