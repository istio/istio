apiVersion: release-notes/v2
kind: bug-fix
area: traffic-management
issue: [61608, 58427]
releaseNotes:
  - |
    **Fixed** ambient workloads and east-west gateways in remote clusters being advertised with the
    local cluster's trust domain, causing connections to them to fail when clusters use different
    trust domains. The trust domain is now read from each cluster's own mesh config.
  - |
    **Fixed** ztunnel rejecting inbound connections from trust domains the mesh is configured to
    accept through `meshConfig.trustDomainAliases` or `meshConfig.caCertificates[].trustDomains`, and
    enforcing its own trust domain when istiod runs with `PILOT_SKIP_VALIDATE_TRUST_DOMAIN`. istiod now
    publishes the accepted trust domains to ztunnel, which reloads them without a restart and closes
    only affected connections when a trust domain is removed.
  - |
    **Fixed** ambient `AuthorizationPolicy` source principals not matching across `meshConfig.trustDomain`
    and `meshConfig.trustDomainAliases`. As for sidecars and waypoints, a principal in the trust domain,
    any of its aliases, or `cluster.local` now matches that identity in all of them.
