    - {type: ResolvedRefs, status: "True", reason: ResolvedRefs, message: "", lastTransitionTime: "2026-11-06T00:00:00Z"}
---
# istiod keeps only the hostnames matching the ServiceEntry host (compatibleRoutesForHost): exactly the host remains,
# the waypoint uses the rule, no warning.
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata: {name: w-filtered, namespace: amb-t}
spec:
  hostnames: ["*.wikitls.example", "api.unrelated.example"]
  parentRefs: [{group: networking.istio.io, kind: ServiceEntry, name: wiki-t}]
  rules:
  - backendRefs: [{group: networking.istio.io, kind: Hostname, name: "*.other.example", port: 443}]
status:
  parents:
  - parentRef: {group: networking.istio.io, kind: ServiceEntry, name: wiki-t}
    controllerName: istio.io/gateway-controller
    conditions:
    - {type: Accepted, status: "True", reason: Accepted, message: "", lastTransitionTime: "2026-11-06T00:00:00Z"}
---
# Parent is a Gateway that happens to share the ServiceEntry name: not a waypoint route, no warning.
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata: {name: w-gateway-parent, namespace: amb-t}
spec:
  hostnames: ["en.wikitls.example"]
  parentRefs: [{group: gateway.networking.k8s.io, kind: Gateway, name: wiki-t}]
  rules:
  - backendRefs: [{group: networking.istio.io, kind: Hostname, name: "*.other.example", port: 443}]
status:
  parents:
  - parentRef: {group: gateway.networking.k8s.io, kind: Gateway, name: wiki-t}
    controllerName: istio.io/gateway-controller
    conditions:
    - {type: Accepted, status: "True", reason: Accepted, message: "", lastTransitionTime: "2026-11-06T00:00:00Z"}
---
# No hostnames: istiod uses the ServiceEntry host, the waypoint uses the rule. No warning.
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata: {name: w-no-hostnames, namespace: amb-t}
spec:
  parentRefs: [{group: networking.istio.io, kind: ServiceEntry, name: wiki-t}]
  rules:
  - backendRefs: [{group: networking.istio.io, kind: Hostname, name: "*.other.example", port: 443}]
status:
  parents:
  - parentRef: {group: networking.istio.io, kind: ServiceEntry, name: wiki-t}
    controllerName: istio.io/gateway-controller
    conditions:
    - {type: Accepted, status: "True", reason: Accepted, message: "", lastTransitionTime: "2026-11-06T00:00:00Z"}
---
# Only weight-0 backends: the rule has no match and the waypoint always uses it. No warning.
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata: {name: w-zero-weight, namespace: amb-t}
spec:
  hostnames: ["en.wikitls.example"]
  parentRefs: [{group: networking.istio.io, kind: ServiceEntry, name: wiki-t}]
  rules:
  - backendRefs: [{group: networking.istio.io, kind: Hostname, name: "*.other.example", port: 443, weight: 0}]
status:
  parents:
  - parentRef: {group: networking.istio.io, kind: ServiceEntry, name: wiki-t}
    controllerName: istio.io/gateway-controller
    conditions:
    - {type: Accepted, status: "True", reason: Accepted, message: "", lastTransitionTime: "2026-11-06T00:00:00Z"}
