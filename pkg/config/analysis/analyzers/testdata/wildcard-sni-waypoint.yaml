# Waypoint: a tls match on a waypoint-bound wildcard DYNAMIC_DNS ServiceEntry is used only when sniHosts is exactly the ServiceEntry host.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: egress-waypoint
  namespace: amb
spec:
  gatewayClassName: istio-waypoint
  listeners: [{name: mesh, port: 15008, protocol: HBONE}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: egress-waypoint
  namespace: amb-ns
spec:
  gatewayClassName: istio-waypoint
  listeners: [{name: mesh, port: 15008, protocol: HBONE}]
---
apiVersion: v1
kind: Namespace
metadata:
  name: amb
  labels:
    istio.io/dataplane-mode: ambient
---
apiVersion: v1
kind: Namespace
metadata:
  name: amb-ns
  labels:
    istio.io/dataplane-mode: ambient
    istio.io/use-waypoint: egress-waypoint
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: wikipedia
  namespace: amb
  labels:
    istio.io/use-waypoint: egress-waypoint
spec:
  hosts: ["*.wikipedia.org"]
  ports: [{number: 443, name: tls, protocol: TLS}]
  location: MESH_EXTERNAL
  resolution: DYNAMIC_DNS
---
# Exact SE host: used, no warning. Second route has no match: used, no warning.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: exact
  namespace: amb
spec:
  hosts: ["*.wikipedia.org"]
  tls:
  - match: [{port: 443, sniHosts: ["*.wikipedia.org"]}]
    route: [{destination: {host: "*.wikipedia.org", port: {number: 443}}}]
  - route: [{destination: {host: "*.wikipedia.org", port: {number: 443}}}]
---
# Narrower SNI, then two SNIs: both matches ignored, two warnings.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: narrow
  namespace: amb
spec:
  hosts: ["*.wikipedia.org"]
  tls:
  - match:
    - {port: 443, sniHosts: ["en.wikipedia.org"]}
    - {sniHosts: ["*.wikipedia.org", "en.wikipedia.org"]}
    route: [{destination: {host: "*.wikipedia.org", port: {number: 443}}}]
---
# Bound only to a Gateway, or matching another port: not used by the waypoint, no warning.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: not-mesh
  namespace: amb
spec:
  hosts: ["*.wikipedia.org"]
  gateways: [some-gateway]
  tls:
  - match: [{port: 443, sniHosts: ["en.wikipedia.org"]}]
    route: [{destination: {host: "*.wikipedia.org", port: {number: 443}}}]
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: other-port
  namespace: amb
spec:
  hosts: ["*.wikipedia.org"]
  tls:
  - match: [{port: 8443, sniHosts: ["en.wikipedia.org"]}, {gateways: [some-gateway], sniHosts: ["en.wikipedia.org"]}]
    route: [{destination: {host: "*.wikipedia.org", port: {number: 443}}}]
---
# SE opts out with use-waypoint: none, in a namespace that uses a waypoint: no warning.
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: optout
  namespace: amb-ns
  labels:
    istio.io/use-waypoint: none
spec:
  hosts: ["*.example.org"]
  ports: [{number: 443, name: tls, protocol: TLS}]
  resolution: DYNAMIC_DNS
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: optout
  namespace: amb-ns
spec:
  hosts: ["*.example.org"]
  tls:
  - match: [{sniHosts: ["www.example.org"]}]
    route: [{destination: {host: "*.example.org", port: {number: 443}}}]
---
# SE without a label in a namespace that uses a waypoint: warning.
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: by-namespace
  namespace: amb-ns
spec:
  hosts: ["*.example.com"]
  ports: [{number: 443, name: tls, protocol: TLS}]
  resolution: DYNAMIC_DNS
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: by-namespace
  namespace: amb-ns
spec:
  hosts: ["*.example.com"]
  tls:
  - match: [{sniHosts: ["www.example.com"]}]
    route: [{destination: {host: "*.example.com", port: {number: 443}}}]
---
# No waypoint: the sidecar case, out of scope here, no warning.
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: no-waypoint
  namespace: default
spec:
  hosts: ["*.example.net"]
  ports: [{number: 443, name: tls, protocol: TLS}]
  resolution: DYNAMIC_DNS
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: no-waypoint
  namespace: default
spec:
  hosts: ["*.example.net"]
  tls:
  - match: [{sniHosts: ["www.example.net"]}]
    route: [{destination: {host: "*.example.net", port: {number: 443}}}]
---
# A rule in the same VirtualService for another host: not for the wildcard ServiceEntry, no warning.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: other-host
  namespace: amb
spec:
  hosts: ["*.wikipedia.org", "api.example.com"]
  tls:
  - match: [{sniHosts: ["api.example.com"]}]
    route: [{destination: {host: api.example.com, port: {number: 443}}}]
---
# Namespace labeled with a waypoint that does not exist: no waypoint, no warning.
apiVersion: v1
kind: Namespace
metadata:
  name: amb-missing
  labels:
    istio.io/use-waypoint: missing-waypoint
---
apiVersion: networking.istio.io/v1
