apiVersion: release-notes/v2
kind: bug-fix
area: security
issue:
  - https://github.com/istio/istio/issues/61558
releaseNotes:
  - |
    **Fixed** an issue where `clearRouteCache` set on an `envoyExtAuthzHttp` or `envoyExtAuthzGrpc` extension provider
    was not applied to the generated Envoy `ext_authz` filter, so headers added by the authorization service on allow
    could not change route selection.
