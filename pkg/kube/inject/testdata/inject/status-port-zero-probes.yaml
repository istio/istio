apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
spec:
  replicas: 7
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      annotations:
        status.sidecar.istio.io/port: "0"
      labels:
        app: hello
    spec:
      containers:
        - name: hello
          image: "fake.docker.io/google-samples/hello-go-gke:1.0"
          ports:
            - name: http
              containerPort: 80
          livenessProbe:
            httpGet:
              port: http
          readinessProbe:
            httpGet:
              port: 3333
          lifecycle:
            preStop:
              httpGet:
                port: 91
            postStart:
              tcpSocket:
                port: 93
