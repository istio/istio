{{- if and (.Values.autoscaling.enabled) (eq .Values.kind "Deployment") }}
{{- range $index, $zone := include "gateway.zones" . | fromJsonArray }}
{{- with $ }}
{{- if $index }}
---
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "gateway.name" . }}{{- with $zone.name }}-{{ . }}{{- end }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ include "gateway.name" . }}
    {{- include "istio.labels" . | nindent 4}}
    {{- include "gateway.labels" . | nindent 4 }}
    {{- with $zone.name }}
    zone: {{ . | quote }}
    {{- end }}
  annotations:
    {{- .Values.annotations | toYaml | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: {{ .Values.kind | default "Deployment" }}
    name: {{ include "gateway.name" . }}{{- with $zone.name }}-{{ . }}{{- end }}
  minReplicas: {{ hasKey $zone "minReplicas" | ternary $zone.minReplicas .Values.autoscaling.minReplicas }}
  maxReplicas: {{ hasKey $zone "maxReplicas" | ternary $zone.maxReplicas .Values.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
          type: Utilization
    {{- end }}
    {{- if .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
          type: Utilization
    {{- end }}
  {{- if .Values.autoscaling.autoscaleBehavior }}
  behavior: {{ toYaml .Values.autoscaling.autoscaleBehavior | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
