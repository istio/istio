# targetRefs to another namespace, or to something that is not a Gateway.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: example-foreign-target-ref
  namespace: default
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: inference-gateway
    namespace: other
  - kind: Service
    name: inference-gateway
  - group: gateway.networking.k8s.io
    kind: Service
    name: inference-gateway
  - group: example.com
    kind: Gateway
    name: inference-gateway
  configPatches:
  - applyTo: HTTP_FILTER
    patch:
      operation: INSERT_FIRST
      value:
        name: envoy.filters.http.ext_proc
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
          grpc_service:
            envoy_grpc:
              cluster_name: "outbound|9003||example-filter.default.svc.cluster.local"
---
