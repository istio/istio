apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: istio
spec:
  controllerName: istio.io/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: section-name
  namespace: default
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: echo-1
    sectionName: tcp
  rules:
  - backendRefs:
    - name: echo
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: name-and-port-agree
  namespace: default
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: echo-1
    sectionName: tcp
    port: 34000
  rules:
  - backendRefs:
    - name: echo
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: name-and-port-conflict
  namespace: default
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: echo-1
    sectionName: http
    port: 34000
  rules:
  - backendRefs:
    - name: echo
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unknown-name
  namespace: default
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: echo-1
    sectionName: nope
  rules:
  - backendRefs:
    - name: echo
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unknown-port
  namespace: default
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: echo-2
    port: 9999
  rules:
  - backendRefs:
    - name: echo
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: grpc-section-name
  namespace: default
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: echo-2
    sectionName: http
  rules:
  - backendRefs:
    - name: echo
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: tcp-section-name
  namespace: default
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: echo-2
    sectionName: tcp
  rules:
  - backendRefs:
    - name: echo
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: tls-section-name
  namespace: default
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: echo-port
    sectionName: http
  hostnames:
  - "tls.example.com"
  rules:
  - backendRefs:
    - name: echo
      port: 80
