# custom-root is the root namespace only in the extprocNameCollisionCustomRootNamespace test, whose mesh
# config sets it; there this EnvoyFilter is reported for all six pool Gateways.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: example-custom-root
  namespace: custom-root
spec:
  configPatches:
  - applyTo: HTTP_FILTER
    patch:
      operation: INSERT_FIRST
      value:
        name: envoy.filters.http.ext_proc
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
          grpc_service:
            envoy_grpc:
              cluster_name: "outbound|9003||example-filter.default.svc.cluster.local"
