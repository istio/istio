kind: ClusterRole
metadata:
  name: istio-reader-clusterrole-prod-istio-system
  labels:
    app: istio-reader
    release: istio-shared
    app.kubernetes.io/name: "istio-reader"
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/instance: "istio-shared"
    app.kubernetes.io/part-of: "istio"
    app.kubernetes.io/version: "1.0.0"
    helm.sh/chart: istiod-1.0.0
rules:
  - apiGroups:
