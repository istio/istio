apiVersion: release-notes/v2
kind: feature
area: traffic-management
issue:
  - 61831
releaseNotes:
  - |
    **Added** DYNAMIC_DNS wildcard ServiceEntry support for classic gateway proxies (for example, an egress gateway) for TLS
    traffic. To use it, set `ENABLE_WILDCARD_HOST_SERVICE_ENTRIES_FOR_TLS=true` on istiod. Then use one of these:
    - A `Gateway` server with `tls.mode: PASSTHROUGH` and a `VirtualService` `tls` route with a single destination whose host is
      the wildcard host (e.g., `*.example.com`).
    - A `Gateway` server with `tls.mode: ISTIO_MUTUAL` and a `VirtualService` `tcp` route with a single destination whose host is
      the wildcard host. The sidecar sends the application TLS to the gateway inside Istio mTLS. Like an ambient waypoint, the
      gateway terminates the mTLS, reads the SNI of the application TLS, and applies `AuthorizationPolicy` after that, so
      `source.principals` is the caller identity and `connection.sni` is the real host. Only SNIs under the wildcard host are
      forwarded. For these servers, `AuthorizationPolicy` is not applied on the mTLS connection itself. As on waypoints, use `remoteIpBlocks` (not `ipBlocks`) to match the client
      address. Also as on waypoints, the TCP idle timeout is applied once, after the mTLS is terminated, and not on the mTLS
      connection itself.
    Weighted routes to the wildcard host are not supported.
    This feature is alpha. It is possible to spoof SNI for TLS connections that match the wildcard host. E.g. a client connecting to
    `foo.example.com` could connect via SE `*.example.com` while having SNI set to `bar.example.com`. Use it only with trusted clients.
