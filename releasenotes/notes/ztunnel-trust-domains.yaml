apiVersion: release-notes/v2
kind: bug-fix
area: traffic-management
issue: [61608, 58427]
releaseNotes:
  - |
    **Fixed** ztunnel rejecting inbound connections from trust domains the mesh is configured to
    accept through `meshConfig.trustDomainAliases` or `meshConfig.caCertificates[].trustDomains`, and
    enforcing its own trust domain when istiod runs with `PILOT_SKIP_VALIDATE_TRUST_DOMAIN`. These settings
    previously applied only to sidecars, waypoints and gateways. istiod now writes the accepted trust domains
    to the `istio-trust-domains` ConfigMap in each namespace, whichever CA issues workload certificates, and
    ztunnel reloads it on change without a restart. When a trust domain is removed, ztunnel closes only the
    connections whose peer used it.
  - |
    **Fixed** ambient `AuthorizationPolicy` source principals not matching across `meshConfig.trustDomain` and
    `meshConfig.trustDomainAliases`. As for sidecars and waypoints, a principal in the trust domain, any of its
    aliases, or `cluster.local` now matches that identity in all of them.
