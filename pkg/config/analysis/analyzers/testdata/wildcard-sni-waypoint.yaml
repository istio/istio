---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: own-service-entry
  namespace: amb
spec:
  hosts: ["fr.wikipedia.org"]
  tls:
  - match: [{sniHosts: ["fr.wikipedia.org"]}]
    route: [{destination: {host: www.google.com, port: {number: 443}}}]
