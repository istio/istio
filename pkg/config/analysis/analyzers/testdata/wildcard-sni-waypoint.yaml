spec:
  gatewayClassName: istio-waypoint
  listeners:
  - name: mesh
    port: 15008
    protocol: HBONE
    allowedRoutes: {namespaces: {from: Selector, selector: {matchLabels: {team: z}}}}
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: sel-same
  namespace: amb-sel-same
  labels:
    istio.io/use-waypoint: wp-sel
spec:
  hosts: ["*.selsame.example"]
  ports: [{number: 443, name: tls, protocol: TLS}]
  resolution: DYNAMIC_DNS
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: sel-same
  namespace: amb-sel-same
spec:
  hosts: ["*.selsame.example"]
  tls:
  - match: [{sniHosts: ["www.selsame.example"]}]
    route: [{destination: {host: "*.selsame.example", port: {number: 443}}}]
---
# Waypoint of another revision (canary): served by an istiod that was not analyzed. No warning.
apiVersion: gateway.networking.k8s.io/v1
