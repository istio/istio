apiVersion: release-notes/v2
kind: bug-fix
area: installation
releaseNotes:
  - |
    **Fixed** `global.trustBundleName` not being applied to the `ClusterTrustBundle` name when
    `ENABLE_CLUSTER_TRUST_BUNDLE_API` was enabled. Injected workloads and ztunnel referenced a
    trust bundle that istiod did not create, causing their pods to fail to start.
