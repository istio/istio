apiVersion: release-notes/v2
kind: bug-fix
area: traffic-management

releaseNotes:
- |
  **Fixed** Gateway API `BackendTLSPolicy` and `XBackend` TLS validation only using `hostname` as SNI. As required by the Gateway API
  specification, the backend certificate must now be valid for `hostname`, unless `subjectAltNames` is set.

upgradeNotes:
- title: BackendTLSPolicy hostname is verified against the backend certificate
  content: |
    A `BackendTLSPolicy` (or `XBackend` TLS validation) without `subjectAltNames` now requires the backend certificate to be
    valid for `validation.hostname`. Previously any certificate signed by the configured CA was accepted. Connections to
    backends whose certificate does not match fail with a 503 response after the upgrade. To keep using a `hostname` that is
    not in the certificate, list the names the certificate is valid for in `validation.subjectAltNames`.
