  tls:
  - match: [{sniHosts: ["www.example.io"]}]
    route: [{destination: {host: "*.example.io", port: {number: 443}}}]
---
# Waypoint for workload traffic only: it does not serve the ServiceEntry, no warning.
apiVersion: v1
