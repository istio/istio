apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: bound-badport
  namespace: egress-wp
  annotations:
    ambient.istio.io/waypoint-inbound-binding: PROXY/abc
spec:
  gatewayClassName: istio-waypoint
  listeners:
  - {name: mesh, port: 15008, protocol: HBONE}
  - {name: proxy, port: 15088, protocol: istio.io/PROXY, allowedRoutes: {namespaces: {from: All}}}
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: bind-badport
  namespace: app-bind
  labels:
    istio.io/use-waypoint: bound-badport
    istio.io/use-waypoint-namespace: egress-wp
spec:
  hosts: ["*.badport.example"]
  ports: [{number: 443, name: tls, protocol: TLS}]
  resolution: DYNAMIC_DNS
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: bind-badport
  namespace: app-bind
spec:
  hosts: ["*.badport.example"]
  tls:
  - match: [{sniHosts: ["www.badport.example"]}]
    route: [{destination: {host: "*.badport.example", port: {number: 443}}}]
---
# A rule for traffic to the ServiceEntry that sends it to another host. The waypoint ignores the narrow match all the
# same: warning.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: other-backend
  namespace: amb
spec:
  hosts: ["*.wikipedia.org"]
  tls:
  - match: [{sniHosts: ["en.wikipedia.org"]}]
    route: [{destination: {host: www.google.com, port: {number: 443}}}]
---
# The same with sniHosts exactly the ServiceEntry host: used, no warning.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: other-backend-exact
  namespace: amb
spec:
  hosts: ["*.wikipedia.org"]
  tls:
  - match: [{sniHosts: ["*.wikipedia.org"]}]
    route: [{destination: {host: www.google.com, port: {number: 443}}}]
---
# fr.wikipedia.org has its own ServiceEntry, so its traffic does not go through the wildcard one. A rule for it is
