# Gateway API TLSRoute on istio-class Gateways (Passthrough) to a wildcard DYNAMIC_DNS ServiceEntry. Layouts match the
# kind ground truth (Obsidian note 18, T-*): the analyzer warns exactly where istiod skips the rule.
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata: {name: wikipedia, namespace: egress}
spec:
  hosts: ["*.wikipedia.org"]
  ports: [{number: 443, name: tls, protocol: TLS}]
  resolution: DYNAMIC_DNS
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: egw, namespace: egress}
spec:
  gatewayClassName: istio
  listeners: [{name: tls, port: 443, protocol: TLS, tls: {mode: Passthrough}, allowedRoutes: {namespaces: {from: All}}}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: egw-wiki, namespace: egress}
spec:
  gatewayClassName: istio
  listeners: [{name: tls, port: 443, protocol: TLS, hostname: "*.wikipedia.org", tls: {mode: Passthrough}}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: egw-org, namespace: egress}
spec:
  gatewayClassName: istio
  listeners: [{name: tls, port: 443, protocol: TLS, hostname: "*.org", tls: {mode: Passthrough}}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: egw-en, namespace: egress}
spec:
  gatewayClassName: istio
  listeners: [{name: tls, port: 443, protocol: TLS, hostname: "en.wikipedia.org", tls: {mode: Passthrough}}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: egw-same, namespace: egress}
spec:
  gatewayClassName: istio
  listeners: [{name: tls, port: 443, protocol: TLS, tls: {mode: Passthrough}}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: egw-two, namespace: egress}
spec:
  gatewayClassName: istio
  listeners: [{name: a, port: 443, protocol: TLS, hostname: "*.wikipedia.org", tls: {mode: Passthrough}}, {name: b, port: 8443, protocol: TLS, tls: {mode: Passthrough}}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: egw-other-class, namespace: egress}
spec:
  gatewayClassName: other
  listeners: [{name: tls, port: 443, protocol: TLS, tls: {mode: Passthrough}}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: egw-terminate, namespace: egress}
spec:
  gatewayClassName: istio
  listeners: [{name: tls, port: 443, protocol: TLS, tls: {mode: Terminate, certificateRefs: [{name: cert}]}}]
---
# Under the host: no warning.
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata: {name: t-b, namespace: egress}
spec:
  hostnames: ["*.wikipedia.org"]
  parentRefs: [{group: gateway.networking.k8s.io, kind: Gateway, name: egw}]
  rules:
  - backendRefs: [{group: networking.istio.io, kind: Hostname, name: "*.wikipedia.org", port: 443}]
status:
  parents:
  - parentRef: {group: gateway.networking.k8s.io, kind: Gateway, name: egw}
    controllerName: istio.io/gateway-controller
    conditions:
    - {type: Accepted, status: "True", reason: Accepted, message: "", lastTransitionTime: "2026-11-06T00:00:00Z"}
    - {type: ResolvedRefs, status: "True", reason: ResolvedRefs, message: "", lastTransitionTime: "2026-11-06T00:00:00Z"}
