# Listener that accepts routes from namespaces labeled team=a.
apiVersion: v1
kind: Namespace
metadata: {name: app-sel, labels: {team: a}}
---
apiVersion: v1
kind: Namespace
metadata: {name: app-nosel}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: egw-sel, namespace: egress}
spec:
  gatewayClassName: istio
  listeners: [{name: tls, port: 443, protocol: TLS, tls: {mode: Passthrough}, allowedRoutes: {namespaces: {from: Selector, selector: {matchLabels: {team: a}}}}}]
