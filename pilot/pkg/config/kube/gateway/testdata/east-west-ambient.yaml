apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eastwestgateway
  namespace: istio-system
  labels:
    topology.istio.io/network: "network-1"
spec:
  gatewayClassName: istio-east-west
  listeners:
  - name: mesh
    port: 15008
    protocol: HBONE
    tls:
      mode: Terminate # represents double-HBONE
      options:
        gateway.istio.io/tls-terminate-mode: ISTIO_MUTUAL
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: invalid
  namespace: istio-system
  labels:
    topology.istio.io/network: "network-1"
spec:
  gatewayClassName: istio-east-west
  listeners:
  - name: mesh
    port: 15008
    protocol: HBONE # No TLS mode terminate
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: with-tls-passthrough
  namespace: istio-system
  labels:
    topology.istio.io/network: "network-1"
spec:
  gatewayClassName: istio-east-west
  listeners:
  - name: mesh
    port: 15008
    protocol: HBONE
    tls:
      mode: Terminate
      options:
        gateway.istio.io/tls-terminate-mode: ISTIO_MUTUAL
  - name: tls-passthrough
    port: 6443
    protocol: TLS
    tls:
      mode: Passthrough
---
# A single east-west gateway serving both ambient (HBONE) and sidecar (AUTO_PASSTHROUGH) traffic.
# Port 15443 with TLS passthrough on a network-labeled gateway is implicitly auto-passthrough.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: with-auto-passthrough
  namespace: istio-system
  labels:
    topology.istio.io/network: "network-1"
spec:
  gatewayClassName: istio-east-west
  listeners:
  - name: mesh
    port: 15008
    protocol: HBONE
    tls:
      mode: Terminate
      options:
        gateway.istio.io/tls-terminate-mode: ISTIO_MUTUAL
  - name: cross-network
    hostname: "*.local"
    port: 15443
    protocol: TLS
    tls:
      mode: Passthrough
---
# Auto-passthrough on a non-default port, selected explicitly via the listener-protocol option.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: with-auto-passthrough-option
  namespace: istio-system
  labels:
    topology.istio.io/network: "network-1"
spec:
  gatewayClassName: istio-east-west
  listeners:
  - name: mesh
    port: 15008
    protocol: HBONE
    tls:
      mode: Terminate
      options:
        gateway.istio.io/tls-terminate-mode: ISTIO_MUTUAL
  - name: cross-network
    port: 35443
    protocol: TLS
    tls:
      mode: Passthrough
      options:
        gateway.istio.io/listener-protocol: auto-passthrough
