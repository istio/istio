---
# Waypoint in another namespace: attachment rules decide, the analyzer stays silent.
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: cross-namespace
  namespace: amb
  labels:
    istio.io/use-waypoint: egress-waypoint
    istio.io/use-waypoint-namespace: amb-ns
spec:
  hosts: ["*.example.app"]
  ports: [{number: 443, name: tls, protocol: TLS}]
  resolution: DYNAMIC_DNS
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: cross-namespace
  namespace: amb
spec:
  hosts: ["*.example.app"]
  tls:
  - match: [{sniHosts: ["www.example.app"]}]
    route: [{destination: {host: "*.example.app", port: {number: 443}}}]
---
# No TLS port: the waypoint builds no TLS chain for it, no warning.
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: plain-http
  namespace: amb
  labels:
    istio.io/use-waypoint: egress-waypoint
spec:
  hosts: ["*.example.biz"]
  ports: [{number: 80, name: http, protocol: HTTP}]
  resolution: DYNAMIC_DNS
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: plain-http
  namespace: amb
spec:
  hosts: ["*.example.biz"]
  tls:
  - match: [{sniHosts: ["www.example.biz"]}]
    route: [{destination: {host: "*.example.biz", port: {number: 443}}}]
---
# Shared waypoint in another namespace that allows all namespaces. The ServiceEntry in app-x points to it.
apiVersion: v1
kind: Namespace
metadata:
  name: egress-wp
---
apiVersion: v1
kind: Namespace
metadata:
  name: app-x
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared-waypoint
  namespace: egress-wp
spec:
  gatewayClassName: istio-waypoint
  listeners: [{name: mesh, port: 15008, protocol: HBONE, allowedRoutes: {namespaces: {from: All}}}]
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: cross
  namespace: app-x
  labels:
    istio.io/use-waypoint: shared-waypoint
    istio.io/use-waypoint-namespace: egress-wp
spec:
  hosts: ["*.cross.example"]
  ports: [{number: 443, name: tls, protocol: TLS}]
  resolution: DYNAMIC_DNS
---
# VirtualService in the ServiceEntry namespace: the waypoint uses it, so the ignored match warns.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: cross-se-ns
  namespace: app-x
spec:
  hosts: ["*.cross.example"]
  tls:
  - match: [{sniHosts: ["www.cross.example"]}]
    route: [{destination: {host: "*.cross.example", port: {number: 443}}}]
---
# VirtualService in the waypoint namespace: the waypoint uses it too.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: cross-wp-ns
  namespace: egress-wp
spec:
  hosts: ["*.cross.example"]
  tls:
  - match: [{sniHosts: ["www.cross.example"]}]
    route: [{destination: {host: "*.cross.example", port: {number: 443}}}]
---
# VirtualService in a third namespace: not used by the waypoint, no warning.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: cross-other-ns
  namespace: default
spec:
  hosts: ["*.cross.example"]
  tls:
  - match: [{sniHosts: ["www.cross.example"]}]
    route: [{destination: {host: "*.cross.example", port: {number: 443}}}]
---
# Waypoint that allows namespaces by label; app-sel matches.
apiVersion: v1
kind: Namespace
metadata:
  name: app-sel
  labels:
    team: a
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: selector-waypoint
  namespace: egress-wp
spec:
  gatewayClassName: istio-waypoint
  listeners:
  - name: mesh
    port: 15008
    protocol: HBONE
    allowedRoutes: {namespaces: {from: Selector, selector: {matchLabels: {team: a}}}}
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: selected
  namespace: app-sel
  labels:
    istio.io/use-waypoint: selector-waypoint
    istio.io/use-waypoint-namespace: egress-wp
spec:
  hosts: ["*.selected.example"]
  ports: [{number: 443, name: tls, protocol: TLS}]
  resolution: DYNAMIC_DNS
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: selected
  namespace: app-sel
spec:
  hosts: ["*.selected.example"]
  tls:
  - match: [{sniHosts: ["www.selected.example"]}]
    route: [{destination: {host: "*.selected.example", port: {number: 443}}}]
---
# Same selector waypoint, namespace without the label: attachment denied, no warning.
apiVersion: v1
kind: Namespace
metadata:
  name: app-nosel
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: not-selected
  namespace: app-nosel
  labels:
    istio.io/use-waypoint: selector-waypoint
    istio.io/use-waypoint-namespace: egress-wp
spec:
  hosts: ["*.notselected.example"]
  ports: [{number: 443, name: tls, protocol: TLS}]
  resolution: DYNAMIC_DNS
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: not-selected
  namespace: app-nosel
spec:
  hosts: ["*.notselected.example"]
  tls:
  - match: [{sniHosts: ["www.notselected.example"]}]
    route: [{destination: {host: "*.notselected.example", port: {number: 443}}}]
---
# VirtualService exported only to app-x: the waypoint in egress-wp does not see it, no warning.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: cross-private
  namespace: app-x
spec:
  hosts: ["*.cross.example"]
  exportTo: ["."]
  tls:
  - match: [{sniHosts: ["api.cross.example"]}]
    route: [{destination: {host: "*.cross.example", port: {number: 443}}}]
---
# Inbound binding annotation: the PROXY listener on 15088 decides attachment, not the HBONE listener on 15008.
apiVersion: v1
kind: Namespace
metadata:
  name: app-bind
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: bound-all
  namespace: egress-wp
  annotations:
    ambient.istio.io/waypoint-inbound-binding: PROXY/15088
spec:
  gatewayClassName: istio-waypoint
  listeners:
  - {name: mesh, port: 15008, protocol: HBONE}
  - {name: proxy, port: 15088, protocol: istio.io/PROXY, allowedRoutes: {namespaces: {from: All}}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: bound-same
  namespace: egress-wp
  annotations:
    ambient.istio.io/waypoint-inbound-binding: PROXY
spec:
  gatewayClassName: istio-waypoint
  listeners:
  - {name: mesh, port: 15008, protocol: HBONE, allowedRoutes: {namespaces: {from: All}}}
  - {name: proxy, port: 15088, protocol: istio.io/PROXY}
---
# Bound listener allows all namespaces: warning.
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: bind-all
  namespace: app-bind
  labels:
    istio.io/use-waypoint: bound-all
    istio.io/use-waypoint-namespace: egress-wp
spec:
  hosts: ["*.bindall.example"]
  ports: [{number: 443, name: tls, protocol: TLS}]
  resolution: DYNAMIC_DNS
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: bind-all
  namespace: app-bind
spec:
  hosts: ["*.bindall.example"]
  tls:
  - match: [{sniHosts: ["www.bindall.example"]}]
    route: [{destination: {host: "*.bindall.example", port: {number: 443}}}]
---
# Bound PROXY listener allows only its own namespace (the HBONE listener would allow all): no warning.
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: bind-same
  namespace: app-bind
  labels:
    istio.io/use-waypoint: bound-same
    istio.io/use-waypoint-namespace: egress-wp
spec:
  hosts: ["*.bindsame.example"]
  ports: [{number: 443, name: tls, protocol: TLS}]
  resolution: DYNAMIC_DNS
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: bind-same
  namespace: app-bind
spec:
  hosts: ["*.bindsame.example"]
  tls:
  - match: [{sniHosts: ["www.bindsame.example"]}]
    route: [{destination: {host: "*.bindsame.example", port: {number: 443}}}]
---
# One match of the rule is exactly the host, so the waypoint uses the whole rule: no warning for the sibling match.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: sibling-exact
  namespace: amb
spec:
  hosts: ["*.wikipedia.org"]
  tls:
  - match: [{sniHosts: ["en.wikipedia.org"]}, {sniHosts: ["*.wikipedia.org"]}]
    route: [{destination: {host: "*.wikipedia.org", port: {number: 443}}}]
---
# Same-namespace waypoint whose HBONE listener only accepts namespaces labeled team=z: the ServiceEntry namespace is
# not labeled, so istiod binds no waypoint. No warning.
apiVersion: v1
kind: Namespace
metadata:
